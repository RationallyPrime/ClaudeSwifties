# Generic single-service template. Connect it to a deployment-owned private
# listener or HTTPS reverse proxy without committing live topology here.

services:
  usage-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - MAX_POOLS=64
      - EDGE_CREDENTIALS_JSON=${USAGE_EDGE_CREDENTIALS_JSON}
      - READ_TOKEN=${USAGE_READ_TOKEN}
      - REQUIRE_LEGACY_IMPORT=${USAGE_REQUIRE_LEGACY_IMPORT:-false}
    volumes:
      - usage-data:/data
    healthcheck:
      # Unauthenticated by design, and therefore NOT proof of anything but
      # liveness. Authenticated /ready is a separate deployment gate.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
volumes:
  usage-data:
